<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Database KPP Madya</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<div class="header-content">

<h1>DATABASE KPP MADYA</h1>
<p>Sertifikasi Pengawas Operasional Utama</p>

</div>

</header>

<div class="container">

<div class="cards">

<div class="card">
<h3>Total Personel</h3>
<div id="totalPersonel">0</div>
</div>

<div class="card">
<h3>Total Perusahaan</h3>
<div id="totalPerusahaan">0</div>
</div>

<div class="card">
<h3>Data Tampil</h3>
<div id="totalTampil">0</div>
</div>

</div>

<div class="filter-box">

<input
type="text"
id="search"
placeholder="Cari Nama Personel...">

<select id="filterPerusahaan">
<option value="">Semua Perusahaan</option>
</select>

</div>

<div class="table-container">

<table>

<thead>

<tr>
<th>Nama</th>
<th>Perusahaan</th>
<th>KPP</th>
<th>Berlaku Sampai</th>
</tr>

</thead>

<tbody id="tbl"></tbody>

</table>

</div>

</div>

<footer>

Database KPP Madya © 2026

</footer>

<script src="data.js"></script>
<script src="script.js"></script>

</body>
</html>
