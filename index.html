<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Database KPP Madya</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="header">

<h1>DATABASE KPP MADYA</h1>

<p>Sertifikasi Pengawas Operasional Utama</p>

</div>

<div class="container">

<div class="stats">

<div class="card">
<h4>Total Personel</h4>
<h2 id="totalPersonel">0</h2>
</div>

<div class="card">
<h4>Total Perusahaan</h4>
<h2 id="totalPerusahaan">0</h2>
</div>

</div>

<input
type="text"
id="search"
placeholder="Cari Nama Karyawan...">

<select id="filterPerusahaan">

<option value="">Semua Perusahaan</option>

</select>

<table>

<thead>

<tr>
<th>Nama</th>
<th>Perusahaan</th>
<th>KPP</th>
<th>Berlaku Sampai</th>
</tr>

</thead>

<tbody id="tbl">

</tbody>

</table>

</div>

<script src="data.js"></script>
<script src="script.js"></script>

</body>
</html>
